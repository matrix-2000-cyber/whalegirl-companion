<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼娘 · 电脑陪聊</title><link rel="icon" href="/whale.png"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<header><a class="brand" href="/">鲸鱼娘<span>陪你待一会儿</span></a><span id="connection" class="connection">正在连接…</span></header>
<main><section class="companion"><div class="eyebrow">属于你的海边小角落</div><h1>鲸鲸在这里。</h1><p class="intro">今天发生了什么，<br>慢慢说给鲸鲸听吧。</p><div id="avatar" class="avatar character-stage"><canvas id="character" width="512" height="512" role="img" aria-label="鲸鱼娘：眨眼、轻微呼吸，随声音开合嘴巴"></canvas></div><p id="state" class="state">在等你说话</p><p id="vision-status" class="heard" role="status">摄像头未开启 · 她还看不到你</p><p id="heard" class="heard" aria-live="polite"></p><div class="controls"><button id="call" class="primary">开始语音陪聊</button><button id="interrupt" hidden>打断她</button><button id="hangup" class="danger" hidden>结束陪聊</button></div><div class="secondary"><button id="mute" hidden>闭麦</button><button id="camera">打开互动摄像头</button><button id="refresh">刷新记录</button><button id="test-voice">试听声音</button></div><p class="footnote"><label for="voice-style">声音：</label><select id="voice-style" aria-label="声音"><option value="cute">晓伊 · 轻柔可爱</option><option value="gentle">晓晓 · 温柔自然</option></select> · 联网合成<br>仅将朗读文字交给语音服务，不发送记忆库</p><audio id="voice-player" controls hidden style="width:100%"></audio><div id="camera-panel" hidden><div class="camera-view"><video id="preview" autoplay muted playsinline></video><canvas id="hand-overlay" width="640" height="480" aria-hidden="true"></canvas></div><p id="hand-status" role="status">打开后可让她跟随你的手指</p><label><input id="hand-follow" type="checkbox" checked>本地手势互动：指尖跟随、挥手问好</label><button id="share">给她看一下</button><label><input id="auto-frame" type="checkbox">聊天时让她看我（发送一帧）</label></div><p class="footnote">不用扫码 · 沿用原来的记忆<br>开启互动摄像头后，聊天会带一帧画面<br>手指追踪在本机运行，不逐帧上传</p></section>
<section class="chat"><div class="chat-heading"><h2>和鲸鲸说说话</h2><span>文字和声音，都认真听</span></div><p id="notice" role="status" hidden></p><div id="messages" class="messages" aria-live="polite"><div class="empty">先说一声“在吗”吧～</div></div><form id="composer"><textarea id="input" maxlength="2000" rows="1" placeholder="和鲸鲸说点什么…" aria-label="聊天内容"></textarea><button id="send" class="primary" type="submit">发送</button></form><p class="tip">Enter 发送，Shift + Enter 换行。语音需要你允许麦克风。</p></section></main>
<noscript>请启用浏览器的 JavaScript 后使用鲸鱼娘。</noscript></body></html>
